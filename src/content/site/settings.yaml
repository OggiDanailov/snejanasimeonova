intro:
  en: "Sculptures in stone, bronze and wood. Snejana Simeonova studied at the National Academy of Fine Arts in Sofia and has taken part in more than fifty international sculpture symposia, from Belgium and Spain to Japan, China and New Zealand."
  bg: "Скулптура в камък, бронз и дърво. Снежана Симеонова е завършила Националната художествена академия в София и е участвала в над петдесет международни скулптурни симпозиума – от Белгия и Испания до Япония, Китай и Нова Зеландия."
